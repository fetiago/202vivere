name: Publicar site no GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - index.html
      - en/**
      - config.js
      - assets/**
      - scripts/build_site.py
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Preparar arquivos públicos
    runs-on: ubuntu-latest
    steps:
      - name: Obter projeto
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Montar publicação
        run: python3 scripts/build_site.py --base-url https://fetiago.github.io/202vivere/
      - name: Armazenar pacote público
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
          include-hidden-files: true

  deploy:
    name: Publicar no Pages
    needs: build
    # Habilitar somente após ativar o Pages com um plano compatível.
    if: vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar pacote
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
